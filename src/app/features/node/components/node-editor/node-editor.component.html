<section aria-label="Node editor" class="w-full pb-6 pt-2">
  <div class="mb-2 flex items-center justify-between gap-3 text-[11px] text-primary-60">
    <div class="flex items-center gap-3">
      <p>Last edited just now</p>
      <p>Type @ to link nodes</p>
    </div>

    <button
      type="button"
      class="stub-toggle"
      [class.is-active]="isStub"
      [attr.aria-pressed]="isStub"
      (click)="toggleStubStatus()"
    >
      <span class="stub-toggle-label">Node Status</span>
      <span class="stub-toggle-value">{{ isStub ? 'STUB' : 'READY' }}</span>
      <span class="stub-toggle-track" aria-hidden="true">
        <span class="stub-toggle-thumb"></span>
      </span>
    </button>
  </div>

  <div>
    <label class="sr-only" for="node-title">Node title</label>
    <input
      id="node-title"
      type="text"
      [(ngModel)]="title"
      (ngModelChange)="onTitleChange()"
      class="w-full border-0 bg-transparent p-0 text-4xl font-semibold tracking-tight text-primary placeholder-accent-muted focus:outline-none"
      placeholder="Untitled"
    />
  </div>

  <tiptap-floating-menu [editor]="editor" [shouldShow]="shouldShowSlashMenu">
    <div class="slash-menu-surface ml-6 rounded-lg shadow-lg" role="listbox" aria-label="Command menu">
      <button
        type="button"
        class="slash-menu-item"
        (click)="runLinkNodeCommand()"
        role="option"
      >
        <span class="slash-menu-title">Link Node</span>
        <span class="slash-menu-hint">Insert @ to choose a node link</span>
      </button>
    </div>
  </tiptap-floating-menu>

  <tiptap-floating-menu [editor]="editor" [shouldShow]="shouldShowMentionMenu">
    <app-mention-suggestions
      [suggestions]="mentionSuggestions"
      [query]="mentionQuery"
      [activeIndex]="mentionMenuActiveIndex"
      (selectMention)="selectMention($event)"
      (createNode)="onCreateMentionRequested($event)"
    />
  </tiptap-floating-menu>

  <tiptap-bubble-menu [editor]="editor">
    <div class="menu-surface flex items-center gap-1.5 rounded-lg px-2 py-1.5 shadow-lg">
      <button type="button" class="menu-btn" (click)="toggleBold()">Bold</button>
      <button type="button" class="menu-btn" (click)="toggleItalic()">Italic</button>
      <button type="button" class="menu-btn" (click)="toggleHeading()">H2</button>
      <button type="button" class="menu-btn" (click)="toggleBulletList()">Bullet</button>
      <button type="button" class="menu-btn" (click)="toggleOrderedList()">Numbered</button>
      <button type="button" class="menu-btn" (click)="toggleCodeBlock()">Code</button>
    </div>
  </tiptap-bubble-menu>

  <tiptap-editor
    [editor]="editor"
    [(ngModel)]="content"
    (ngModelChange)="onEditorStateChange()"
  ></tiptap-editor>
</section>
