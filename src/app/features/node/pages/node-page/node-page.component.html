<section class="min-h-screen bg-surface">
  <div class="grid min-h-[calc(100vh-65px)] grid-cols-1 lg:grid-cols-[250px_minmax(0,1fr)_280px]">
    <app-left-panel />

    <main class="p-4 text-primary" aria-label="Main panel">
      <app-node-editor
        [initialTitle]="nodeTitle"
        [initialIsStub]="nodeIsStub"
        [initialContent]="nodeContent"
        (nodeChange)="onNodeChange($event)"
        (createNodeRequested)="onCreateNodeRequested($event)"
      />
    </main>

    <app-right-panel />
  </div>
</section>
