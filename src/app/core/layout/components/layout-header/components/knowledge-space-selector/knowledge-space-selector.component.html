@if (selectorState$ | async; as state) {
  <div class="knowledge-space-selector relative shrink-0">
    <button
      type="button"
      class="flex items-center gap-2 rounded-md border border-accent-active bg-primary px-3 py-2 text-sm font-semibold text-surface transition hover:bg-accent-active focus:outline-none focus:ring-2 focus-ring-surface cursor-pointer"
      [attr.aria-expanded]="isMenuOpen"
      aria-haspopup="menu"
      (click)="toggleMenu()"
    >
      <span>{{ state.selectedSpace?.name ?? 'Select Knowledge Space' }}</span>
      <app-icon
        class="transition-transform"
        [class.rotate-180]="isMenuOpen"
        name="chevron-down"
        size="1rem"
      ></app-icon>
    </button>

    @if (isMenuOpen) {
      <div
        class="absolute left-0 top-[calc(100%+0.5rem)] z-100 min-w-48 rounded-lg border border-accent-muted bg-white p-1.5 text-primary shadow-xl"
        role="menu"
        aria-label="Knowledge Spaces"
      >
        @for (space of state.spaces; track space.id) {
          <button
            type="button"
            class="flex w-full items-center justify-between rounded-md px-3 py-2 text-left text-sm transition hover:bg-surface cursor-pointer"
            [class.bg-surface]="state.selectedSpace?.id === space.id"
            role="menuitem"
            (click)="selectKnowledgeSpace(space)"
          >
            <span>{{ space.name }}</span>
            @if (state.selectedSpace?.id === space.id) {
              <span aria-hidden="true">✓</span>
            }
          </button>
        }

        <div class="my-1 border-t border-accent-muted" role="separator"></div>

        <button
          type="button"
          class="flex w-full items-center rounded-md px-3 py-2 text-left text-sm font-semibold text-primary transition hover:bg-surface cursor-pointer"
          role="menuitem"
          (click)="createKnowledgeSpace()"
        >
          Manage Spaces
        </button>
      </div>
    }
  </div>
}
