<header class="fixed inset-x-0 top-0 z-40 w-full border-b border-accent-muted bg-primary px-4 py-3 sm:px-6">
  <div class="mx-auto flex w-full max-w-300 items-center justify-between gap-3">
    <app-search-field (searchChange)="onSearchChange($event)"></app-search-field>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="shrink-0 rounded-md border border-accent-active bg-accent-active px-3 py-2 text-sm font-semibold text-surface transition hover:brightness-95 focus:outline-none focus:ring-2 focus-ring-surface"
        (click)="onNewNodeClick()"
      >
        + New Node
      </button>

      <app-knowledge-space-selector></app-knowledge-space-selector>
    </div>
  </div>
</header>
