@switch (name) {
  @case ('chevron-down') {
    <svg
      [style.width]="size"
      [style.height]="size"
      viewBox="0 0 20 20"
      fill="none"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="m5 7.5 5 5 5-5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
}
